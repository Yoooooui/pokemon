  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; line-height: 1.8; color: #333; }

<body>
  <h1>プライバシーポリシー</h1>
  <p>本サービスは、ポケモンセンターの抽選情報をお知らせする個人利用の通知ボットです。</p>

  <h2>取得する情報</h2>
  <p>本サービスはLINE Messaging APIを通じて、通知の送信先として登録されたユーザーIDのみを利用します。</p>

  <h2>利用目的</h2>
  <p>取得した情報は、ポケモンセンターの抽選開始通知の送信のみに使用します。第三者への提供は行いません。</p>

  <h2>情報の管理</h2>
  <p>ユーザーIDは本サービスの設定ファイル内にのみ保存し、外部サービスへの送信・公開は行いません。</p>

  <h2>お問い合わせ</h2>
  <p>本ポリシーに関するご質問は、サービス管理者までご連絡ください。</p>

  <p style="margin-top:3em; color:#888; font-size:0.85em;">最終更新: 2026年4月</p>
</body>
